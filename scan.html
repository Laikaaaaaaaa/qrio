<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qrio - Quét Vé</title>
  <meta name="description" content="Quét mã QR vé điện tử để kiểm tra và xác nhận vé." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://qrio.site/scan.html" />
  
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://qrio.site/scan.html" />
  <meta property="og:title" content="Qrio - Quét Vé Điện Tử" />
  <meta property="og:description" content="Quét mã QR vé điện tử để kiểm tra và xác nhận vé." />
  <meta property="og:image" content="https://qrio.site/static/logo/logo.png" />
  
  <meta name="theme-color" content="#7c3aed" />
  
  <link rel="icon" type="image/x-icon" href="/static/logo/favicon_io%20(3)/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/logo/favicon_io%20(3)/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/logo/favicon_io%20(3)/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ANIMATED BACKGROUND */
    .bg-effects {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(56px);
      opacity: 0.28;
      animation: floatOrb 28s ease-in-out infinite;
    }
    
    .bg-orb-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      top: -100px;
      right: -100px;
    }
    
    .bg-orb-2 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      bottom: 100px;
      left: -100px;
      animation-delay: -5s;
    }
    
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(-30px, -20px) scale(1.02); }
    }
    
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* HEADER */
    .header {
      height: 64px;
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-box {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 13px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(124, 58, 237, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #22c55e);
      color: #fff;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* CONTAINER */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }

    .page-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .page-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(79, 70, 229, 0.1));
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 999px;
      font-size: 13px;
      color: #a78bfa;
      margin-bottom: 16px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      color: #94a3b8;
      font-size: 14px;
    }

    /* CARD */
    .card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title i {
      color: #a78bfa;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab:hover {
      background: rgba(124, 58, 237, 0.1);
      border-color: rgba(124, 58, 237, 0.2);
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(79, 70, 229, 0.1));
      border-color: rgba(124, 58, 237, 0.4);
      color: #fff;
    }

    .tab.active i {
      color: #a78bfa;
    }

    /* SCANNER */
    .scanner-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 1;
      max-height: 350px;
      margin: 0 auto;
    }

    #scanner-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scanner-frame {
      width: 200px;
      height: 200px;
      border: 3px solid #7c3aed;
      border-radius: 20px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .scanner-frame::before,
    .scanner-frame::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #22c55e;
      border-style: solid;
    }

    .scanner-frame::before {
      top: -3px;
      left: -3px;
      border-width: 4px 0 0 4px;
      border-radius: 10px 0 0 0;
    }

    .scanner-frame::after {
      bottom: -3px;
      right: -3px;
      border-width: 0 4px 4px 0;
      border-radius: 0 0 10px 0;
    }

    .scanner-hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* FILE UPLOAD */
    .file-upload-area {
      border: 2px dashed rgba(124, 58, 237, 0.4);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .file-upload-area:hover {
      border-color: #7c3aed;
      background: rgba(124, 58, 237, 0.05);
    }

    .file-upload-area.dragover {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }

    .upload-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(79, 70, 229, 0.1));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
      color: #a78bfa;
    }

    .file-upload-area h4 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .file-upload-area p {
      color: #94a3b8;
      font-size: 13px;
    }

    #file-input {
      display: none;
    }

    /* MANUAL INPUT */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(124, 58, 237, 0.5);
      background: rgba(124, 58, 237, 0.05);
    }

    .form-group input::placeholder {
      color: #64748b;
    }

    /* RESULT */
    .result-box {
      text-align: center;
      padding: 24px;
    }

    .result-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
    }

    .result-icon.success {
      background: linear-gradient(135deg, #10b981, #22c55e);
    }

    .result-icon.error {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .result-icon.warning {
      background: linear-gradient(135deg, #f59e0b, #f97316);
    }

    .result-box h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .result-box p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* LOADING */
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    /* RECENT SCANS */
    .recent-scans {
      margin-top: 24px;
    }

    .recent-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: all 0.2s;
    }

    .recent-item:hover {
      background: rgba(124, 58, 237, 0.1);
      border-color: rgba(124, 58, 237, 0.2);
    }

    .recent-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recent-item-icon {
      width: 36px;
      height: 36px;
      background: rgba(34, 197, 94, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #22c55e;
    }

    .recent-item-icon.used {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .recent-item-text h5 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .recent-item-text p {
      font-size: 11px;
      color: #64748b;
    }

    .recent-item-time {
      font-size: 11px;
      color: #64748b;
    }

    /* PAYMENT STATUS BADGES */
    .payment-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .payment-status.paid {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }

    .payment-status.pending {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
    }

    .payment-status.pending_verification {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
    }

    .payment-status.pending_payment {
      background: rgba(249, 115, 22, 0.2);
      color: #f97316;
    }

    /* TICKET DETAILS IN RESULT */
    .ticket-details {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      text-align: left;
    }

    .ticket-detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
    }

    .ticket-detail-row:last-child {
      border-bottom: none;
    }

    .ticket-detail-row span:first-child {
      color: #94a3b8;
    }

    .ticket-detail-row span:last-child {
      color: #fff;
      font-weight: 500;
    }

    /* PROOF IMAGE */
    .proof-section {
      margin: 16px 0;
      text-align: center;
    }

    .proof-section h4 {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .proof-image-container {
      max-width: 300px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .proof-image-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ACTION BUTTONS */
    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #10b981, #22c55e);
      color: #fff;
    }

    .btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
    }

    .btn-cancel {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
    }

    .btn-cancel:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
    }

    .btn-back-scan {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    @media (max-width: 500px) {
      .container {
        padding: 24px 16px;
      }

      .tabs {
        flex-direction: column;
      }

      .scanner-frame {
        width: 160px;
        height: 160px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-effects">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>
  <div class="bg-grid"></div>

  <header class="header">
    <div class="header-left">
      <a href="home.html" class="logo-box"><img src="/static/logo/logo.png" alt="Qrio"></a>
      <h1>Qrio</h1>
    </div>
    <div class="header-right">
      <a href="ticket-create.html" class="btn btn-secondary btn-sm">
        <i class="fa-solid fa-plus"></i>
        <span>Tạo vé</span>
      </a>
      <a href="home.html" class="btn btn-primary btn-sm">
        <i class="fa-solid fa-house"></i>
        <span>Trang chủ</span>
      </a>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <div class="page-badge"><i class="fa-solid fa-qrcode"></i> Dành cho nhân viên</div>
      <h1 class="page-title">Quét Vé Điện Tử</h1>
      <p class="page-subtitle">Quét mã QR trên vé điện tử để kiểm tra và xác nhận</p>
    </div>

    <div class="card">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab(event, 'camera')">
          <i class="fa-solid fa-camera"></i>
          Camera
        </button>
        <button class="tab" onclick="switchTab(event, 'upload')">
          <i class="fa-solid fa-image"></i>
          Tải ảnh
        </button>
        <button class="tab" onclick="switchTab(event, 'manual')">
          <i class="fa-solid fa-keyboard"></i>
          Nhập mã
        </button>
      </div>

      <!-- Camera Scanner -->
      <div id="tab-camera">
        <div class="scanner-container">
          <video id="scanner-video" autoplay playsinline muted></video>
          <canvas id="scanner-canvas" style="display: none;"></canvas>
          <div class="scanner-overlay">
            <div class="scanner-frame"></div>
          </div>
          <div class="scanner-hint">Đưa mã QR vào khung hình</div>
        </div>
        <div style="text-align: center; margin-top: 16px;">
          <button class="btn btn-secondary" id="toggle-camera" onclick="toggleCamera()">
            <i class="fa-solid fa-video"></i>
            Bật camera
          </button>
        </div>
      </div>

      <!-- File Upload -->
      <div id="tab-upload" class="hidden">
        <div class="file-upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
          <div class="upload-icon"><i class="fa-solid fa-cloud-upload-alt"></i></div>
          <h4>Tải ảnh mã QR</h4>
          <p>Kéo thả hoặc nhấn để chọn ảnh</p>
        </div>
        <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)" />
      </div>

      <!-- Manual Input -->
      <div id="tab-manual" class="hidden">
        <div class="form-group">
          <label>Nhập mã vé</label>
          <input type="text" id="manual-code" placeholder="VD: VEM1ABC123XYZ" style="text-transform: uppercase;" />
        </div>
        <button class="btn btn-primary" onclick="checkManualCode()" style="width: 100%;">
          <i class="fa-solid fa-search"></i>
          Kiểm tra vé
        </button>
      </div>
    </div>

    <!-- Result -->
    <div class="card hidden" id="result-section">
      <div class="result-box" id="result-content">
        <!-- Dynamic content -->
      </div>
    </div>

    <!-- Recent Scans -->
    <div class="card" id="recent-section">
      <div class="recent-scans">
        <div class="recent-title">
          <i class="fa-solid fa-history"></i>
          Quét gần đây
        </div>
        <div class="recent-list" id="recent-list">
          <p style="color: #64748b; font-size: 13px; text-align: center; padding: 20px;">Chưa có lịch sử quét</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let videoStream = null;
    let scannerActive = false;
    let currentTab = 'camera';
    let lastCameraErrorShown = false;

    // ===== TAB SWITCHING =====
    function switchTab(evt, tab) {
      currentTab = tab;
      
      // Update tab buttons
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (evt && evt.target) {
        const btn = evt.target.closest('.tab');
        if (btn) btn.classList.add('active');
      }

      // Show/hide content
      document.getElementById('tab-camera').classList.toggle('hidden', tab !== 'camera');
      document.getElementById('tab-upload').classList.toggle('hidden', tab !== 'upload');
      document.getElementById('tab-manual').classList.toggle('hidden', tab !== 'manual');

      // Manage camera
      if (tab === 'camera') {
        // Only start camera on user gesture (tab click)
        startScanner();
      } else {
        stopScanner();
      }

      // Hide result
      document.getElementById('result-section').classList.add('hidden');
    }

    // ===== CAMERA SCANNER =====
    async function startScanner() {
      try {
        if (videoStream && scannerActive) {
          return;
        }

        const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const isSecure = window.isSecureContext || location.protocol === 'https:' || isLocalhost;
        if (!isSecure) {
          stopScanner();
          showResult('error', 'Không thể mở camera', 'Trình duyệt chỉ cho phép mở camera trên HTTPS. Vui lòng mở website bằng https:// hoặc dùng chế độ “Tải ảnh / Nhập mã”.');
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          stopScanner();
          showResult('error', 'Không hỗ trợ camera', 'Thiết bị/trình duyệt của bạn không hỗ trợ camera. Vui lòng dùng “Tải ảnh” hoặc “Nhập mã”.');
          return;
        }

        const video = document.getElementById('scanner-video');
        video.muted = true;
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = videoStream;

        // iOS/Safari sometimes needs explicit play()
        try { await video.play(); } catch (e) { /* ignore */ }

        scannerActive = true;
        lastCameraErrorShown = false;
        requestAnimationFrame(scanFrame);
        
        document.getElementById('toggle-camera').innerHTML = '<i class="fa-solid fa-video-slash"></i> Tắt camera';
      } catch (error) {
        console.error('Camera error:', error);
        stopScanner();

        if (lastCameraErrorShown) return;
        lastCameraErrorShown = true;

        let msg = 'Không thể truy cập camera. Vui lòng cho phép quyền truy cập hoặc sử dụng “Tải ảnh”.';
        if (error && (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError')) {
          msg = 'Bạn đã từ chối quyền camera. Hãy vào cài đặt trình duyệt để bật lại quyền camera cho website, hoặc dùng “Tải ảnh / Nhập mã”.';
        } else if (error && (error.name === 'NotFoundError' || error.name === 'OverconstrainedError')) {
          msg = 'Không tìm thấy camera phù hợp trên thiết bị. Vui lòng dùng “Tải ảnh / Nhập mã”.';
        }

        showResult('error', 'Không thể mở camera', msg);
      }
    }

    function stopScanner() {
      scannerActive = false;
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      const video = document.getElementById('scanner-video');
      if (video) {
        try { video.pause(); } catch (e) { /* ignore */ }
        video.srcObject = null;
      }
      document.getElementById('toggle-camera').innerHTML = '<i class="fa-solid fa-video"></i> Bật camera';
    }

    function toggleCamera() {
      if (scannerActive) {
        stopScanner();
      } else {
        startScanner();
      }
    }

    function scanFrame() {
      if (!scannerActive) return;

      const video = document.getElementById('scanner-video');
      const canvas = document.getElementById('scanner-canvas');
      const ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, canvas.width, canvas.height);

        if (code) {
          scannerActive = false;
          processQRData(code.data);
          return;
        }
      }

      requestAnimationFrame(scanFrame);
    }

    // ===== FILE UPLOAD =====
    const dropZone = document.getElementById('drop-zone');

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        processImageFile(file);
      }
    });

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        processImageFile(file);
      }
    }

    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const tryDecodeAtMaxSize = (maxSize) => {
            const canvas = document.createElement('canvas');
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            canvas.width = Math.max(1, Math.floor(img.width * scale));
            canvas.height = Math.max(1, Math.floor(img.height * scale));
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            return jsQR(imageData.data, canvas.width, canvas.height);
          };

          const sizes = [1600, 1200, 900, 600, 420];
          let code = null;
          for (const s of sizes) {
            code = tryDecodeAtMaxSize(s);
            if (code) break;
          }

          if (code && code.data) {
            processQRData(code.data);
            return;
          }

          showResult('error', 'Không tìm thấy mã QR', 'Vui lòng chọn ảnh có chứa mã QR rõ ràng (ảnh nét, đủ sáng, không bị lóa).');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ===== MANUAL INPUT =====
    function checkManualCode() {
      const code = document.getElementById('manual-code').value.trim().toUpperCase();
      if (!code) {
        alert('Vui lòng nhập mã vé');
        return;
      }

      // Try to find ticket
      const ticket = localStorage.getItem('ticket_' + code);
      if (ticket) {
        processQRData(JSON.stringify({ type: 'QRIO_TICKET', ticketId: code }));
      } else {
        showResult('error', 'Không tìm thấy vé', `Mã vé "${code}" không tồn tại trong hệ thống.`);
      }
    }

    // ===== PROCESS QR DATA =====
    function processQRData(data) {
      const raw = String(data || '').trim();
      if (!raw) {
        showResult('error', 'Mã QR không hợp lệ', 'Không thể đọc dữ liệu từ mã QR này.');
        return;
      }

      // 1) JSON payload
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.type === 'QRIO_TICKET' && parsed.ticketId) {
          checkTicket(String(parsed.ticketId).trim().toUpperCase());
          return;
        }
      } catch (e) {
        // ignore
      }

      // 2) URL payload (optional)
      try {
        if (/^https?:\/\//i.test(raw)) {
          const url = new URL(raw);
          const maybeId = url.searchParams.get('id') || url.searchParams.get('ticketId') || url.searchParams.get('code');
          if (maybeId) {
            checkTicket(String(maybeId).trim().toUpperCase());
            return;
          }
        }
      } catch (e) {
        // ignore
      }

      // 3) Plain ticket code
      const candidate = raw.replace(/\s+/g, '').toUpperCase();
      if (/^[A-Z0-9_-]{6,}$/.test(candidate)) {
        checkTicket(candidate);
        return;
      }

      showResult('error', 'Mã QR không hợp lệ', 'Đây không phải là mã QR vé điện tử Qrio.');
    }

    function checkTicket(ticketId) {
      const stored = localStorage.getItem('ticket_' + ticketId);
      
      if (!stored) {
        showResult('error', 'Vé không tồn tại', `Không tìm thấy vé với mã ${ticketId}`);
        return;
      }

      const ticket = JSON.parse(stored);
      
      // Add to recent scans
      addToRecentScans(ticket);

      // Check ticket status
      if (ticket.status === 'used') {
        showResult('warning', 'Vé đã sử dụng', `Vé này đã được sử dụng trước đó.`, ticket);
      } else if (ticket.status === 'pending_verification') {
        showResult('pending', 'Chờ xác nhận thanh toán', `Vé này đang chờ xác nhận thanh toán từ chủ sự kiện.`, ticket);
      } else if (ticket.status === 'pending_payment') {
        showResult('cash_pending', 'Chờ thanh toán tiền mặt', `Vé này đang chờ thanh toán tiền mặt.`, ticket);
      } else {
        showResult('success', 'Vé hợp lệ', `Vé hợp lệ và sẵn sàng sử dụng.`, ticket);
      }
    }

    async function fetchOrderData(orderId) {
      try {
        // Try to get from localStorage first
        const stored = localStorage.getItem('order_' + orderId);
        if (stored) {
          return JSON.parse(stored);
        }
        
        // Try to fetch from API
        const resp = await fetch(`/api/ticket/orders/${orderId}`);
        if (resp.ok) {
          return await resp.json();
        }
      } catch (e) {
        console.log('Could not fetch order data', e);
      }
      return null;
    }

    async function showResult(type, title, message, ticket = null) {
      const resultSection = document.getElementById('result-section');
      const resultContent = document.getElementById('result-content');

      let iconClass = type === 'pending' || type === 'cash_pending' ? 'warning' : type;
      let icon = type === 'success' ? 'fa-check' : (type === 'error' ? 'fa-times' : 'fa-exclamation');

      let html = `
        <div class="result-icon ${iconClass}"><i class="fa-solid ${icon}"></i></div>
        <h3>${title}</h3>
        <p>${message}</p>
      `;

      if (ticket) {
        let order = null;
        if (ticket.orderId) {
          order = await fetchOrderData(ticket.orderId);
        }

        const totalTickets = Math.max(1, parseInt(ticket.totalTickets || (order && order.quantity) || 1, 10) || 1);
        const perTicket = Number(ticket.price || 0) || 0;
        const totalAmount = (order && typeof order.totalAmount === 'number')
          ? Number(order.totalAmount || 0)
          : (perTicket * totalTickets);

        // Payment status badge
        let statusBadge = '';
        if (ticket.status === 'valid' || ticket.status === 'paid') {
          statusBadge = '<div class="payment-status paid"><i class="fa-solid fa-check-circle"></i> Đã thanh toán</div>';
        } else if (ticket.status === 'pending_verification') {
          statusBadge = '<div class="payment-status pending_verification"><i class="fa-solid fa-clock"></i> Chờ xác nhận</div>';
        } else if (ticket.status === 'pending_payment') {
          statusBadge = '<div class="payment-status pending_payment"><i class="fa-solid fa-money-bill"></i> Chờ thanh toán tiền mặt</div>';
        } else if (ticket.status === 'used') {
          statusBadge = '<div class="payment-status pending"><i class="fa-solid fa-check-double"></i> Đã sử dụng</div>';
        }

        // Ticket details
        html += `
          ${statusBadge}
          <div class="ticket-details">
            <div class="ticket-detail-row">
              <span>Mã vé</span>
              <span>${ticket.ticketId}</span>
            </div>
            <div class="ticket-detail-row">
              <span>Sự kiện</span>
              <span>${ticket.eventName || 'N/A'}</span>
            </div>
            <div class="ticket-detail-row">
              <span>Người mua</span>
              <span>${ticket.buyerName || 'N/A'}</span>
            </div>
            <div class="ticket-detail-row">
              <span>Email</span>
              <span>${ticket.buyerEmail || 'N/A'}</span>
            </div>
            <div class="ticket-detail-row">
              <span>Số điện thoại</span>
              <span>${ticket.buyerPhone || 'N/A'}</span>
            </div>
            <div class="ticket-detail-row">
              <span>Số vé</span>
              <span>${totalTickets} / ${totalTickets}</span>
            </div>
            <div class="ticket-detail-row">
              <span>Giá vé</span>
              <span>${formatCurrency(totalAmount)}</span>
            </div>
            ${ticket.paymentType === 'cash' ? `
            <div class="ticket-detail-row">
              <span>Loại thanh toán</span>
              <span><i class="fa-solid fa-money-bill" style="color: #22c55e;"></i> Tiền mặt</span>
            </div>
            <div class="ticket-detail-row">
              <span>Thời điểm thanh toán</span>
              <span>${ticket.cashPaymentTime || 'N/A'}</span>
            </div>
            ` : ''}
          </div>
        `;

        // Try to get proof image from order
        let proofImage = null;
        if (order && order.proofImage) {
          proofImage = order.proofImage;
        }

        // Show proof image if available
        if (proofImage) {
          html += `
            <div class="proof-section">
              <h4><i class="fa-solid fa-image"></i> Ảnh xác nhận thanh toán</h4>
              <div class="proof-image-container">
                <img src="${proofImage}" alt="Ảnh xác nhận" />
              </div>
            </div>
          `;
        }

        // Action buttons based on status
        html += '<div class="action-buttons">';
        
        if (ticket.status === 'pending_verification' || ticket.status === 'pending_payment') {
          html += `
            <button class="btn btn-confirm" onclick="confirmTicketPayment('${ticket.ticketId}')">
              <i class="fa-solid fa-check"></i>
              Xác nhận thanh toán
            </button>
            <button class="btn btn-cancel" onclick="cancelTicket('${ticket.ticketId}')">
              <i class="fa-solid fa-times"></i>
              Hủy vé
            </button>
          `;
        } else if (ticket.status !== 'used') {
          html += `
            <button class="btn btn-success" onclick="markAsUsed('${ticket.ticketId}')">
              <i class="fa-solid fa-check"></i>
              Đánh dấu đã dùng
            </button>
          `;
        }

        html += `
            <button class="btn btn-secondary" onclick="viewTicketInfo('${ticket.ticketId}')">
              <i class="fa-solid fa-eye"></i>
              Xem chi tiết
            </button>
            <button class="btn btn-back-scan" onclick="resetScanner()">
              <i class="fa-solid fa-qrcode"></i>
              Quét tiếp
            </button>
          </div>
        `;
      } else {
        html += `
          <div class="action-buttons">
            <button class="btn btn-back-scan" onclick="resetScanner()">
              <i class="fa-solid fa-redo"></i>
              Quét lại
            </button>
          </div>
        `;
      }

      resultContent.innerHTML = html;
      resultSection.classList.remove('hidden');
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount || 0) + ' đ';
    }

    async function confirmTicketPayment(ticketId) {
      const stored = localStorage.getItem('ticket_' + ticketId);
      if (!stored) return;

      const ticket = JSON.parse(stored);
      
      // Update ticket status
      ticket.status = 'valid';
      ticket.confirmedAt = new Date().toISOString();
      localStorage.setItem('ticket_' + ticketId, JSON.stringify(ticket));

      // Update order status
      if (ticket.orderId) {
        const orderStored = localStorage.getItem('order_' + ticket.orderId);
        if (orderStored) {
          const order = JSON.parse(orderStored);
          order.status = 'paid';
          order.paidAt = new Date().toISOString();
          localStorage.setItem('order_' + ticket.orderId, JSON.stringify(order));
        }

        // Try to confirm via API
        try {
          await fetch(`/api/ticket/orders/${ticket.orderId}/confirm`, { method: 'POST' });
        } catch (e) {
          console.log('API confirm failed, local update done');
        }
      }

      showResult('success', 'Đã xác nhận thanh toán', `Vé "${ticketId}" đã được xác nhận thanh toán thành công.`);
      updateRecentScans();
    }

    async function cancelTicket(ticketId) {
      if (!confirm('Bạn có chắc muốn hủy vé này?')) return;

      const stored = localStorage.getItem('ticket_' + ticketId);
      if (!stored) return;

      const ticket = JSON.parse(stored);
      
      // Update ticket status
      ticket.status = 'cancelled';
      ticket.cancelledAt = new Date().toISOString();
      localStorage.setItem('ticket_' + ticketId, JSON.stringify(ticket));

      // Update order status
      if (ticket.orderId) {
        const orderStored = localStorage.getItem('order_' + ticket.orderId);
        if (orderStored) {
          const order = JSON.parse(orderStored);
          order.status = 'cancelled';
          order.cancelledAt = new Date().toISOString();
          localStorage.setItem('order_' + ticket.orderId, JSON.stringify(order));
        }

        // Try to cancel via API
        try {
          await fetch(`/api/ticket/orders/${ticket.orderId}/cancel`, { method: 'POST' });
        } catch (e) {
          console.log('API cancel failed, local update done');
        }
      }

      showResult('error', 'Đã hủy vé', `Vé "${ticketId}" đã bị hủy.`);
      updateRecentScans();
    }

    function viewTicketInfo(ticketId) {
      window.location.href = `information.html?id=${ticketId}`;
    }

    function markAsUsed(ticketId) {
      const stored = localStorage.getItem('ticket_' + ticketId);
      if (stored) {
        const ticket = JSON.parse(stored);
        ticket.status = 'used';
        ticket.usedAt = new Date().toISOString();
        localStorage.setItem('ticket_' + ticketId, JSON.stringify(ticket));
        
        showResult('success', 'Đã xác nhận', `Vé "${ticketId}" đã được đánh dấu là đã sử dụng.`);
        updateRecentScans();
      }
    }

    function resetScanner() {
      document.getElementById('result-section').classList.add('hidden');
      if (currentTab === 'camera') {
        if (videoStream) {
          scannerActive = true;
          requestAnimationFrame(scanFrame);
        } else {
          startScanner();
        }
      }
    }

    // ===== RECENT SCANS =====
    function addToRecentScans(ticket) {
      let recent = JSON.parse(localStorage.getItem('recent_scans') || '[]');
      
      // Remove if exists
      recent = recent.filter(r => r.ticketId !== ticket.ticketId);
      
      // Add to front
      recent.unshift({
        ticketId: ticket.ticketId,
        eventName: ticket.eventName,
        buyerName: ticket.buyerName,
        status: ticket.status,
        scannedAt: new Date().toISOString()
      });
      
      // Keep only last 10
      recent = recent.slice(0, 10);
      
      localStorage.setItem('recent_scans', JSON.stringify(recent));
      updateRecentScans();
    }

    function updateRecentScans() {
      const recent = JSON.parse(localStorage.getItem('recent_scans') || '[]');
      const listEl = document.getElementById('recent-list');

      if (recent.length === 0) {
        listEl.innerHTML = '<p style="color: #64748b; font-size: 13px; text-align: center; padding: 20px;">Chưa có lịch sử quét</p>';
        return;
      }

      listEl.innerHTML = recent.map(item => {
        const time = new Date(item.scannedAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        const isUsed = item.status === 'used';
        
        return `
          <div class="recent-item" onclick="viewTicketInfo('${item.ticketId}')">
            <div class="recent-item-info">
              <div class="recent-item-icon ${isUsed ? 'used' : ''}">
                <i class="fa-solid ${isUsed ? 'fa-times' : 'fa-check'}"></i>
              </div>
              <div class="recent-item-text">
                <h5>${item.ticketId}</h5>
                <p>${item.buyerName} - ${item.eventName}</p>
              </div>
            </div>
            <span class="recent-item-time">${time}</span>
          </div>
        `;
      }).join('');
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      updateRecentScans();
      // Do not auto-start camera on load.
      // Camera permission prompts are more reliable when triggered by a user action.
    });
  </script>
