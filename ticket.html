<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qrio - Vé Điện Tử</title>
  <meta name="description" content="Vé điện tử QR - Quét mã để check-in nhanh chóng." />
  <meta name="robots" content="noindex, nofollow" />
  
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Qrio - Vé Điện Tử" />
  <meta property="og:description" content="Vé điện tử QR - Quét mã để check-in." />
  <meta property="og:image" content="https://qrio.site/static/logo/logo.png" />
  
  <meta name="theme-color" content="#7c3aed" />
  
  <link rel="icon" type="image/x-icon" href="/static/logo/favicon_io%20(3)/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/logo/favicon_io%20(3)/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/logo/favicon_io%20(3)/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ANIMATED BACKGROUND */
    .bg-effects {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(56px);
      opacity: 0.28;
      animation: floatOrb 28s ease-in-out infinite;
    }

    .bg-orb-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      top: -100px;
      right: -100px;
    }
    
    .bg-orb-2 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      bottom: -100px;
      left: -100px;
      animation-delay: -5s;
    }
    
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(-30px, -20px) scale(1.02); }
    }
    
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* HEADER */
    .header {
      height: 64px;
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-box {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 13px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(124, 58, 237, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #22c55e);
      color: #fff;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.35);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* CONTAINER */
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }

    /* TICKET CARD */
    .ticket-card {
      background: linear-gradient(180deg, #1a1a2e 0%, #16162a 100%);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      position: relative;
    }

    .ticket-header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 24px;
      text-align: center;
    }

    .ticket-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .ticket-event-name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .ticket-subtitle {
      font-size: 13px;
      opacity: 0.85;
    }

    /* Cutout effect */
    .ticket-cutout {
      height: 24px;
      position: relative;
      background: #0f0f1a;
    }

    .ticket-cutout::before,
    .ticket-cutout::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: #0f0f1a;
      border-radius: 50%;
      top: -12px;
    }

    .ticket-cutout::before {
      left: -12px;
    }

    .ticket-cutout::after {
      right: -12px;
    }

    .ticket-cutout-line {
      position: absolute;
      top: 50%;
      left: 24px;
      right: 24px;
      border-top: 2px dashed rgba(255,255,255,0.15);
    }

    .ticket-body {
      padding: 24px;
    }

    /* QR Section */
    .qr-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .qr-wrapper {
      width: 200px;
      height: 200px;
      margin: 0 auto 16px;
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .qr-wrapper img {
      max-width: 100%;
      max-height: 100%;
    }

    .ticket-id {
      font-family: monospace;
      font-size: 14px;
      color: #a78bfa;
      letter-spacing: 2px;
    }

    /* Info Grid */
    .ticket-info {
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #94a3b8;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-label i {
      width: 16px;
      color: #7c3aed;
    }

    .info-value {
      font-weight: 600;
      font-size: 14px;
      text-align: right;
    }

    /* Status */
    .ticket-status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
    }

    .status-valid {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }

    .status-pending {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.28);
      color: #fbbf24;
    }

    .status-cancelled {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #ef4444;
    }

    .status-used {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .status-icon {
      font-size: 20px;
      margin-right: 8px;
    }

    .proof-box {
      margin-top: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .proof-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .proof-sub {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .proof-preview {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      display: none;
      max-height: 360px;
      object-fit: contain;
    }

    .proof-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
    }

    /* Action Buttons */
    .ticket-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .ticket-actions .btn {
      flex: 1;
    }

    /* Error State */
    .error-box {
      text-align: center;
      padding: 60px 20px;
    }

    .error-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }

    .error-box h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .error-box p {
      color: #94a3b8;
      margin-bottom: 24px;
    }

    /* Loading */
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 60px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 500px) {
      .container {
        padding: 24px 16px;
      }

      .ticket-event-name {
        font-size: 18px;
      }

      .qr-wrapper {
        width: 180px;
        height: 180px;
      }
    }

    @media print {
      @page { size: auto; margin: 12mm; }
      body {
        background: #fff;
        color: #111;
      }
      .bg-effects, .bg-grid, .header, .ticket-actions, .proof-box, #order-section {
        display: none !important;
      }
      .container {
        padding: 0;
        max-width: 760px;
      }
      .ticket-card {
        margin: 0;
        box-shadow: none;
        background: #fff;
        color: #111;
      }
      .ticket-header {
        background: #f3f4f6;
        color: #0f172a;
      }
      .ticket-body {
        padding: 18px;
      }
      .ticket-info {
        background: rgba(0,0,0,0.04);
      }
      .ticket-status {
        border: 1px solid rgba(0,0,0,0.1);
        background: rgba(255,255,255,0.8);
      }
      .qr-wrapper {
        background: #fff;
        width: 260px;
        height: 260px;
        margin: 0 auto 16px;
        padding: 18px;
      }
      .qr-wrapper img {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
      }
      .ticket-card, .ticket-card * {
        color: inherit;
      }
      .ticket-card {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <div class="bg-effects">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>
  <div class="bg-grid"></div>

  <header class="header">
    <div class="header-left">
      <a href="home.html" class="logo-box"><img src="/static/logo/logo.png" alt="Qrio"></a>
      <h1>Qrio</h1>
    </div>
    <div class="header-right">
      <a href="home.html" class="btn btn-primary btn-sm">
        <i class="fa-solid fa-house"></i>
        <span>Trang chủ</span>
      </a>
    </div>
  </header>

  <div class="container">
    <!-- Loading -->
    <div id="loading">
      <div class="loading-spinner"></div>
    </div>

    <!-- Error -->
    <div class="error-box hidden" id="error-section">
      <div class="error-icon"><i class="fa-solid fa-ticket-xmark"></i></div>
      <h2>Không tìm thấy vé</h2>
      <p id="error-message">Link không hợp lệ hoặc vé không tồn tại.</p>
      <a href="home.html" class="btn btn-primary">
        <i class="fa-solid fa-house"></i>
        Về trang chủ
      </a>
    </div>

    <!-- Ticket Card -->
    <div class="ticket-card hidden" id="ticket-section">
      <div class="ticket-header">
        <div class="ticket-badge">
          <i class="fa-solid fa-ticket"></i>
          VÉ ĐIỆN TỬ
        </div>
        <h1 class="ticket-event-name" id="event-name">-</h1>
        <p class="ticket-subtitle" id="event-desc">-</p>
      </div>

      <div class="ticket-cutout">
        <div class="ticket-cutout-line"></div>
      </div>

      <div class="ticket-body">
        <div class="qr-section">
          <div class="qr-wrapper" id="ticket-qr">
            <div class="loading-spinner" style="width: 40px; height: 40px; margin: 0;"></div>
          </div>
          <div class="ticket-id" id="ticket-id">-</div>
        </div>

        <div class="ticket-info">
          <div class="info-row">
            <span class="info-label"><i class="fa-solid fa-user"></i> Họ tên</span>
            <span class="info-value" id="buyer-name">-</span>
          </div>
          <div class="info-row">
            <span class="info-label"><i class="fa-solid fa-ticket"></i> Số vé</span>
            <span class="info-value" id="ticket-number">-</span>
          </div>
          <div class="info-row">
            <span class="info-label"><i class="fa-solid fa-calendar"></i> Ngày mua</span>
            <span class="info-value" id="purchase-date">-</span>
          </div>
          <div class="info-row">
            <span class="info-label"><i class="fa-solid fa-money-bill"></i> Giá vé</span>
            <span class="info-value" id="ticket-price">-</span>
          </div>
        </div>

        <div class="ticket-status status-valid" id="ticket-status">
          <i class="fa-solid fa-circle-check status-icon"></i>
          <span id="status-text">VÉ HỢP LỆ</span>
        </div>

        <div class="ticket-actions">
          <button class="btn btn-success" onclick="saveTicket()">
            <i class="fa-solid fa-download"></i>
            Lưu vé
          </button>
          <button class="btn btn-secondary" onclick="window.print()">
            <i class="fa-solid fa-print"></i>
            In vé
          </button>
          <button class="btn btn-danger" id="btn-cancel-order" onclick="cancelMyOrder()" style="display:none;">
            <i class="fa-solid fa-ban"></i>
            Hủy vé
          </button>
        </div>

        <div class="proof-box hidden" id="order-section">
          <div class="proof-title"><i class="fa-solid fa-receipt" style="color:#a78bfa;"></i> Đơn hàng & xác nhận</div>
          <div class="proof-sub" id="order-subtitle">-</div>

          <div class="ticket-info" style="margin-bottom: 12px;">
            <div class="info-row">
              <span class="info-label"><i class="fa-solid fa-hashtag"></i> Mã đơn</span>
              <span class="info-value" id="order-id">-</span>
            </div>
            <div class="info-row">
              <span class="info-label"><i class="fa-solid fa-circle-info"></i> Trạng thái thanh toán</span>
              <span class="info-value" id="order-status">-</span>
            </div>
            <div class="info-row" id="order-note-row" style="display:none;">
              <span class="info-label"><i class="fa-solid fa-note-sticky"></i> Ghi chú</span>
              <span class="info-value" id="order-note">-</span>
            </div>
          </div>

          <img id="proof-preview" class="proof-preview" alt="Ảnh xác nhận" />

          <div class="proof-row">
            <input id="proof-file" type="file" accept="image/*" class="btn btn-secondary" style="padding: 10px 14px;" />
            <button id="btn-upload-proof" class="btn btn-success" onclick="uploadProof()" disabled>
              <i class="fa-solid fa-cloud-arrow-up"></i>
              Gửi ảnh xác nhận
            </button>
            <button id="btn-clear-proof" class="btn btn-secondary" onclick="clearProof()" disabled>
              <i class="fa-solid fa-trash"></i>
              Xoá ảnh
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ticketData = null;
    let currentOrderId = '';
    let currentOrder = null;
    let proofDataUrl = '';
    let _realtimeSocket = null;
    let _realtimeBoundTicketId = '';

    function setupRealtimeForTicket(ticketId) {
      const tid = String(ticketId || '').trim().toUpperCase();
      if (!tid) return;
      if (_realtimeBoundTicketId === tid) return;
      if (!window.io) return;

      _realtimeBoundTicketId = tid;

      try {
        if (_realtimeSocket) {
          try { _realtimeSocket.disconnect(); } catch {}
          _realtimeSocket = null;
        }

        _realtimeSocket = window.io({
          transports: ['websocket', 'polling'],
          timeout: 8000,
        });

        _realtimeSocket.on('connect', () => {
          try { _realtimeSocket.emit('join', { ticketId: tid }); } catch {}
        });

        _realtimeSocket.on('ticket_updated', (msg) => {
          try {
            const updatedId = String((msg && msg.ticketId) || '').trim().toUpperCase();
            if (!updatedId) return;
            if (updatedId !== tid) return;
            window.location.reload();
          } catch {
            // ignore
          }
        });
      } catch {
        // ignore
      }
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + ' VND';
    }

    function formatDate(isoString) {
      const date = new Date(isoString);
      return date.toLocaleDateString('vi-VN', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const orderIdParam = (urlParams.get('order') || '').trim();
      let ticketId = (urlParams.get('id') || '').trim();

      if (orderIdParam) {
        currentOrderId = orderIdParam;
        // Resolve ticketId from cached order if possible
        if (!ticketId) {
          try {
            const cached = localStorage.getItem('order_' + currentOrderId);
            const o = cached ? JSON.parse(cached) : null;
            if (o && Array.isArray(o.tickets) && o.tickets.length) {
              ticketId = o.tickets[0];
            }
          } catch {
            // ignore
          }
        }

        // If not found in cache, fetch from server
        if (!ticketId) {
          try {
            const resp = await fetch(`/api/ticket/orders/${encodeURIComponent(currentOrderId)}`);
            const json = await resp.json().catch(() => ({}));
            if (resp.ok && json && Array.isArray(json.ticketIds) && json.ticketIds.length) {
              ticketId = String(json.ticketIds[0] || '').trim();
              // Cache for next time (optional)
              try {
                const cached = localStorage.getItem('order_' + currentOrderId);
                const o = cached ? JSON.parse(cached) : {};
                o.orderId = currentOrderId;
                o.tickets = json.ticketIds;
                localStorage.setItem('order_' + currentOrderId, JSON.stringify(o));
              } catch {}
            }
          } catch {
            // ignore
          }
        }
      }

      if (!ticketId) {
        showError('Link không hợp lệ.');
        return;
      }

      setupRealtimeForTicket(ticketId);

      // Prefer server-side ticket registry
      try {
        const resp = await fetch(`/api/ticket/tickets/${encodeURIComponent(ticketId)}`);
        const json = await resp.json().catch(() => ({}));
        if (resp.ok && json && !json.error) {
          ticketData = {
            ticketId: json.ticketId,
            orderId: json.orderId,
            eventId: json.eventId,
            eventName: json.eventName,
            description: json.description,
            buyerName: json.buyerName,
            buyerEmail: json.buyerEmail,
            buyerPhone: json.buyerPhone,
            buyerNote: json.buyerNote,
            ticketNumber: json.ticketNumber || 1,
            totalTickets: json.totalTickets || json.quantity || 1,
            price: json.pricePerTicket || 0,
            paymentType: json.paymentType || 'transfer',
            cashPaymentTime: json.cashPaymentTime || '',
            status: (json.ticketStatus || '').toLowerCase() || 'valid',
            issuedAt: json.createdAt ? new Date(json.createdAt * 1000).toISOString() : new Date().toISOString()
          };
        } else {
          throw new Error((json && json.error) || 'Không tìm thấy vé');
        }
      } catch (e) {
        // Fallback: old local storage
        const stored = localStorage.getItem('ticket_' + ticketId);
        if (!stored) {
          showError('Không tìm thấy vé. Vé có thể đã bị xóa hoặc không tồn tại.');
          return;
        }
        try {
          ticketData = JSON.parse(stored);
        } catch {
          showError('Dữ liệu vé không hợp lệ.');
          return;
        }
      }

      // Prefer orderId stored in ticket
      if (ticketData && ticketData.orderId) {
        currentOrderId = ticketData.orderId;
      }

      if (currentOrderId) {
        await fetchOrder();
      }

      // Display ticket
      displayTicket();
    }

    function showError(message) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error-message').textContent = message;
      document.getElementById('error-section').classList.remove('hidden');
    }

    async function displayTicket() {
      // Basic info
      document.getElementById('event-name').textContent = ticketData.eventName;
      document.getElementById('event-desc').textContent = ticketData.description || 'Vé điện tử';
      document.getElementById('ticket-id').textContent = ticketData.ticketId;
      document.getElementById('buyer-name').textContent = ticketData.buyerName;
      document.getElementById('ticket-number').textContent = `${ticketData.totalTickets} / ${ticketData.totalTickets}`;
      document.getElementById('purchase-date').textContent = formatDate(ticketData.issuedAt);
      const totalTickets = Math.max(1, parseInt(ticketData.totalTickets || 1, 10) || 1);
      const perTicket = Number(ticketData.price || 0) || 0;
      const totalAmount = (currentOrder && typeof currentOrder.totalAmount === 'number')
        ? Number(currentOrder.totalAmount || 0)
        : (perTicket * totalTickets);
      document.getElementById('ticket-price').textContent = formatCurrency(totalAmount);

      // Status
      const statusEl = document.getElementById('ticket-status');
      const statusIconEl = statusEl ? statusEl.querySelector('.status-icon') : null;
      const statusTextEl = document.getElementById('status-text');
      
      if (ticketData.status === 'used') {
        statusEl.className = 'ticket-status status-used';
        if (statusIconEl) statusIconEl.className = 'fa-solid fa-circle-xmark status-icon';
        statusTextEl.textContent = 'ĐÃ SỬ DỤNG';
      } else {
        const os = (currentOrder && currentOrder.status) ? String(currentOrder.status).toLowerCase() : '';
        if (os === 'cancelled') {
          statusEl.className = 'ticket-status status-cancelled';
          if (statusIconEl) statusIconEl.className = 'fa-solid fa-circle-xmark status-icon';
          statusTextEl.textContent = 'ĐƠN ĐÃ HUỶ';
        } else if (os === 'pending_verification') {
          statusEl.className = 'ticket-status status-pending';
          if (statusIconEl) statusIconEl.className = 'fa-solid fa-hourglass-half status-icon';
          statusTextEl.textContent = 'CHỜ DUYỆT';
        } else if (os === 'pending' || os === 'pending_payment') {
          statusEl.className = 'ticket-status status-pending';
          if (statusIconEl) statusIconEl.className = 'fa-solid fa-clock status-icon';
          statusTextEl.textContent = 'CHỜ THANH TOÁN';
        } else {
          statusEl.className = 'ticket-status status-valid';
          if (statusIconEl) statusIconEl.className = 'fa-solid fa-circle-check status-icon';
          statusTextEl.textContent = 'VÉ HỢP LỆ';
        }
      }

      // Generate QR code
      await generateTicketQR();

      // Order/proof section
      await initOrderSection();

      // Show ticket
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('ticket-section').classList.remove('hidden');
    }

    async function fetchOrder() {
      try {
        const resp = await fetch(`/api/ticket/orders/${encodeURIComponent(currentOrderId)}`);
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok || !json || json.error) return;
        currentOrder = json;

        // Update local cache (keep existing ticket list if any)
        try {
          const cacheKey = 'order_' + currentOrderId;
          const cached = localStorage.getItem(cacheKey);
          const o = cached ? JSON.parse(cached) : {};
          o.orderId = currentOrderId;
          o.status = json.status;
          o.paymentType = json.paymentType || o.paymentType;
          o.paymentProofImage = json.paymentProofImage || o.paymentProofImage;
          if (typeof json.buyerNote === 'string') o.buyerNote = json.buyerNote;
          if (json.paidAt) o.paidAt = json.paidAt;
          localStorage.setItem(cacheKey, JSON.stringify(o));
        } catch {
          // ignore
        }
      } catch {
        // ignore
      }
    }

    function humanOrderStatus(status) {
      const s = String(status || '').toLowerCase();
      if (s === 'paid') return 'ĐÃ THANH TOÁN';
      if (s === 'pending_verification') return 'CHỜ DUYỆT';
      if (s === 'pending') return 'CHỜ THANH TOÁN';
      if (s === 'pending_payment') return 'CHỜ THANH TOÁN TIỀN MẶT';
      if (s === 'cancelled') return 'ĐÃ HUỶ';
      return status || '-';
    }

    async function initOrderSection() {
      const oid = currentOrderId || (ticketData && ticketData.orderId) || '';
      if (!oid) return;
      currentOrderId = oid;

      document.getElementById('order-section').classList.remove('hidden');
      document.getElementById('order-id').textContent = currentOrderId;

      // Ensure we have freshest data
      if (!currentOrder) {
        await fetchOrder();
      }

      let effectiveStatus = (currentOrder && currentOrder.status) || '';
      let proof = (currentOrder && currentOrder.paymentProofImage) || '';
      let paymentType = (currentOrder && currentOrder.paymentType) || '';
      let buyerNote = (currentOrder && currentOrder.buyerNote) || '';

      // Fallbacks from cache
      try {
        const cached = localStorage.getItem('order_' + currentOrderId);
        if (cached) {
          const o = JSON.parse(cached);
          effectiveStatus = effectiveStatus || o.status || '';
          proof = proof || o.paymentProofImage || '';
          paymentType = paymentType || o.paymentType || '';
          buyerNote = buyerNote || o.buyerNote || '';
        }
      } catch {
        // ignore
      }

      try {
        proof = proof || localStorage.getItem('proof_' + currentOrderId) || '';
      } catch {
        // ignore
      }

      document.getElementById('order-status').textContent = humanOrderStatus(effectiveStatus);

      const noteRow = document.getElementById('order-note-row');
      const noteEl = document.getElementById('order-note');
      const hasNote = String(buyerNote || '').trim().length > 0;
      if (noteRow) noteRow.style.display = hasNote ? '' : 'none';
      if (noteEl) noteEl.textContent = hasNote ? String(buyerNote).trim() : '-';

      const pt = String(paymentType || '').toLowerCase();
      const isCash = pt === 'cash';
      const canUpload = !isCash && ['pending', 'pending_verification'].includes(String(effectiveStatus || '').toLowerCase());

      // Cancel button
      const btnCancel = document.getElementById('btn-cancel-order');
      const cancellableStatuses = ['pending', 'pending_verification', 'pending_payment'];
      const isCancelled = String(effectiveStatus || '').toLowerCase() === 'cancelled';
      const isPaid = String(effectiveStatus || '').toLowerCase() === 'paid';
      const isUsed = (ticketData && ticketData.status) === 'used';
      const canCancel = !isUsed && !isCancelled && !isPaid && cancellableStatuses.includes(String(effectiveStatus || '').toLowerCase());
      if (btnCancel) btnCancel.style.display = canCancel ? '' : 'none';

      document.getElementById('order-subtitle').textContent = isCash
        ? 'Thanh toán tiền mặt: không cần gửi ảnh xác nhận.'
        : (canUpload
          ? 'Bạn có thể gửi lại ảnh xác nhận để chủ sự kiện duyệt.'
          : 'Đơn hàng đã được cập nhật. Ảnh xác nhận (nếu có) sẽ hiển thị tại đây.');

      const proofEl = document.getElementById('proof-preview');
      if (proof) {
        proofEl.src = proof;
        proofEl.style.display = 'block';
        document.getElementById('btn-clear-proof').disabled = false;
      } else {
        proofEl.removeAttribute('src');
        proofEl.style.display = 'none';
      }

      const fileInput = document.getElementById('proof-file');
      const btnUpload = document.getElementById('btn-upload-proof');
      const proofRow = document.querySelector('#order-section .proof-row');

      if (isCash) {
        if (proofRow) proofRow.style.display = 'none';
      } else {
        if (proofRow) proofRow.style.display = '';
      }

      fileInput.disabled = !canUpload;
      btnUpload.disabled = !canUpload;

      if (!fileInput.dataset.bound) {
        fileInput.dataset.bound = '1';
        fileInput.addEventListener('change', async () => {
          const f = fileInput.files && fileInput.files[0];
          if (!f) return;
          if (f.size > 5 * 1024 * 1024) {
            alert('File ảnh quá lớn (tối đa 5MB)');
            fileInput.value = '';
            return;
          }
          proofDataUrl = await readFileAsDataURL(f);
          if (proofDataUrl) {
            proofEl.src = proofDataUrl;
            proofEl.style.display = 'block';
            document.getElementById('btn-clear-proof').disabled = false;
            btnUpload.disabled = !canUpload;
          }
        });
      }
    }

    async function cancelMyOrder() {
      if (!currentOrderId) {
        alert('Không tìm thấy mã đơn để hủy.');
        return;
      }

      const ok = confirm('Bạn có chắc muốn hủy vé/đơn hàng này? Thao tác này không thể hoàn tác.');
      if (!ok) return;

      const btn = document.getElementById('btn-cancel-order');
      const old = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang hủy...';
      }

      try {
        const resp = await fetch(`/api/ticket/orders/${encodeURIComponent(currentOrderId)}/cancel`, {
          method: 'POST'
        });
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok || (json && json.error)) {
          throw new Error((json && json.error) || 'Không thể hủy đơn hàng');
        }

        // Update local cache
        try {
          const cacheKey = 'order_' + currentOrderId;
          const cached = localStorage.getItem(cacheKey);
          const o = cached ? JSON.parse(cached) : {};
          o.orderId = currentOrderId;
          o.status = 'cancelled';
          localStorage.setItem(cacheKey, JSON.stringify(o));
        } catch {
          // ignore
        }

        currentOrder = null;
        await fetchOrder();
        await displayTicket();
        alert('Đã hủy đơn hàng.');
      } catch (e) {
        alert(String(e.message || e));
      } finally {
        if (btn) {
          btn.innerHTML = old;
          btn.disabled = false;
        }
      }
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || ''));
        r.onerror = () => resolve('');
        r.readAsDataURL(file);
      });
    }

    async function uploadProof() {
      if (!currentOrderId) return;
      const img = proofDataUrl || (document.getElementById('proof-preview').src || '');
      if (!img) {
        alert('Vui lòng chọn ảnh trước');
        return;
      }

      const btn = document.getElementById('btn-upload-proof');
      const old = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang gửi...';

      try {
        const resp = await fetch(`/api/ticket/orders/${encodeURIComponent(currentOrderId)}/upload-proof`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: img })
        });
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok || (json && json.error)) throw new Error((json && json.error) || 'Không thể tải lên ảnh');

        try { localStorage.setItem('proof_' + currentOrderId, img); } catch {}

        currentOrder = null;
        await fetchOrder();
        await displayTicket();
      } catch (e) {
        alert(String(e.message || e));
      } finally {
        btn.innerHTML = old;
        btn.disabled = false;
      }
    }

    function clearProof() {
      proofDataUrl = '';
      try { if (currentOrderId) localStorage.removeItem('proof_' + currentOrderId); } catch {}
      const proofEl = document.getElementById('proof-preview');
      proofEl.src = '';
      proofEl.style.display = 'none';
      const fileInput = document.getElementById('proof-file');
      if (fileInput) fileInput.value = '';
      document.getElementById('btn-clear-proof').disabled = true;
    }

    async function generateTicketQR() {
      const qrData = JSON.stringify({
        type: 'QRIO_TICKET',
        ticketId: ticketData.ticketId,
        eventName: ticketData.eventName,
        buyerName: ticketData.buyerName
      });

      const formData = new FormData();
      formData.append('data', qrData);
      formData.append('qr_color', '#4f46e5');
      formData.append('bg_color', '#ffffff');
      formData.append('ecc_level', 'H');

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.image) {
          document.getElementById('ticket-qr').innerHTML = `<img src="${result.image}" alt="Ticket QR" />`;
        }
      } catch (error) {
        console.error('Error generating QR:', error);
        document.getElementById('ticket-qr').innerHTML = '<p style="color: #ef4444; font-size: 12px;">Lỗi tạo mã QR</p>';
      }
    }

    async function saveTicket() {
      const ticketCard = document.querySelector('.ticket-card');
      
      try {
        const canvas = await html2canvas(ticketCard, {
          backgroundColor: '#1a1a2e',
          scale: 2,
          onclone: (doc) => {
            const card = doc.querySelector('.ticket-card');
            if (!card) return;

            // Only export the ticket itself (no buttons, no proof/order section)
            const actions = card.querySelector('.ticket-actions');
            if (actions) actions.style.display = 'none';
            const orderSection = card.querySelector('#order-section');
            if (orderSection) orderSection.style.display = 'none';
          }
        });

        const link = document.createElement('a');
        link.download = `ve-${ticketData.ticketId}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (error) {
        alert('Không thể lưu vé. Vui lòng chụp màn hình.');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
